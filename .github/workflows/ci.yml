name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore StrataShell.sln
      - name: Format check
        run: dotnet format StrataShell.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build StrataShell.sln -c Release --no-restore --no-incremental
      - name: Test
        run: dotnet test StrataShell.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Audit NuGet vulnerabilities
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/audit-packages.ps1
      - name: Publish portable build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish.ps1 -Version 0.1.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: StrataShell-portable
          path: artifacts/release/*
